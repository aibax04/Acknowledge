<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile - Acknowledge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../static/js/api.js"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        }
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981', // Emerald 500
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen flex flex-col justify-center items-center">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full glass-panel z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-teal-400">Acknowledge</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="Api.logout()" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="glass-panel p-8 rounded-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Complete Your Profile</h2>
            <p class="text-gray-500 text-sm mt-1">Please provide the remaining details to submit your account for approval.</p>
        </div>

        <form id="onboardingForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullname" class="w-full px-4 py-2 bg-white/50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="w-full px-4 py-2 bg-white/50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number <span class="text-red-500">*</span></label>
                <input type="tel" id="phone" required placeholder="e.g. +91 9876543210" class="w-full px-4 py-2 bg-white/50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Joining Date <span class="text-red-500">*</span></label>
                <input type="date" id="joining_date" required class="w-full px-4 py-2 bg-white/50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
            </div>

            <button type="submit" class="w-full mt-4 bg-primary text-white font-medium py-2.5 rounded-lg hover:bg-emerald-600 transition-colors">
                Submit for Approval
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const user = await Api.getProfile();
                document.getElementById('fullname').value = user.full_name;
                document.getElementById('email').value = user.email;
                if (user.phone) document.getElementById('phone').value = user.phone;
                // Prefill joining date: use existing value or default to today
                const joiningEl = document.getElementById('joining_date');
                joiningEl.value = user.joining_date || new Date().toISOString().split('T')[0];
            } catch (err) {
                Api.logout();
            }
        });

        document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const fullName = document.getElementById('fullname').value.trim();
            const joiningDate = document.getElementById('joining_date').value;
            if (!joiningDate) { alert('Please enter your joining date.'); return; }
            const btn = e.target.querySelector('button');
            const origText = btn.innerText;
            btn.innerText = 'Submitting...';
            btn.disabled = true;

            try {
                await Api.post('/auth/me', { phone, full_name: fullName, joining_date: joiningDate });
                window.location.href = 'pending.html';
            } catch (err) {
                alert("Failed to save details: " + err.message);
                btn.innerText = origText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
